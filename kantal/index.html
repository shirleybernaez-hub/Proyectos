<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Fichas Técnicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; }
        
        .reveal { animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes reveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Contenedor que respeta el tamaño natural del JPG */
        .jpg-frame {
            width: fit-content;
            margin: 0 auto;
        }
        
        .btn-download {
            transition: all 0.3s ease;
            border: 2px solid black;
        }
        .btn-download:hover { background: black; color: white; }
    </style>
</head>
<body class="antialiased">

    <!-- HERO: Logo de mayor impacto sin eslogan -->
    <section class="h-[55vh] flex flex-col justify-center items-center text-center px-6">
        <div class="reveal">
            <!-- Logo más grande estilo Caracas Bakery -->
            <img src="logo/logokantal.svg" alt="Kantal" class="w-80 md:w-[650px] h-auto">
        </div>
    </section>

    <!-- CUERPO DE LA PÁGINA -->
    <main class="max-w-6xl mx-auto py-12 px-6">
        
        <!-- Bloque de Títulos Centrados -->
        <header class="mb-24 text-center flex flex-col items-center">
            <h2 class="text-4xl md:text-5xl font-black tracking-tighter uppercase mb-4">FICHAS TÉCNICAS</h2>
            <p class="text-zinc-400 text-[10px] uppercase tracking-[0.6em] mb-16">Documentación Oficial de Productos</p>
            
            <div class="flex flex-col items-center">
                <h3 class="text-2xl md:text-4xl font-black uppercase tracking-tight mb-2">Línea de Perros y Gatos</h3>
                <div class="h-1.5 w-24 bg-black"></div>
            </div>
        </header>

        <!-- Sección de Producto -->
        <section class="flex flex-col items-center text-center">
            <!-- Nombre del producto después de la línea -->
            <h4 class="text-[18px] font-bold uppercase tracking-[0.2em] mb-12">Enjuague Desenderante</h4>
            
            <!-- Imagen al tamaño real del JPG -->
            <div class="jpg-frame mb-12">
                <img src="fichas/perrosygatos/Enjuage desenderante.jpg" 
                     alt="Ficha Técnica" 
                     class="max-w-full h-auto shadow-2xl transition-transform duration-500 hover:scale-[1.01]">
            </div>

            <!-- Botón de Descarga -->
            <div class="mb-32">
                <a href="fichas/perrosygatos/Enjuage desenderante.pdf" download 
                   class="btn-download px-16 py-5 text-[10px] font-black uppercase tracking-[0.3em] inline-block">
                    Descargar PDF
                </a>
            </div>
        </section>

    </main>

    <footer class="py-20 text-center border-t border-zinc-50">
        <p class="text-zinc-300 text-[10px] font-bold uppercase tracking-[0.5em]">Kantal Food 2026</p>
    </footer>

</body>
</html>
