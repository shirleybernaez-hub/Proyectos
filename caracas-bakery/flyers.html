<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyers | Caracas Bakery</title>
    <style>
        :root {
            --cb-tan: #B9936C;
            --cb-charcoal: #434244;
            --cb-stone: #BDB5AD;
            --cb-cream: #EBE1D5;
            --bg-light: #FAFAFA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--cb-charcoal);
        }

        .nav-back {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-back a {
            text-decoration: none;
            color: var(--cb-tan);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
            text-align: center;
        }

        header { margin-bottom: 50px; }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .flyers-comparison {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            align-items: start;
        }

        .flyer-item {
            background: white;
            border-radius: 32px;
            padding: 30px; /* Aumentado para dar aire igual que en la referencia */
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .version-badge {
            display: inline-block;
            background-color: var(--cb-cream);
            color: var(--cb-tan);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            align-self: center;
        }

        .image-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            line-height: 0;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .comment-section { margin-bottom: 25px; }

        .comment-box {
            display: flex;
            align-items: center;
            background: #F4F4F4;
            border-radius: 20px;
            padding: 10px 15px;
            border: 1px solid #EAEAEA;
        }

        .comment-box input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.85rem;
            padding: 5px;
        }

        .send-btn {
            background: var(--cb-tan);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .send-btn svg { width: 18px; color: white; }

        .status-msg {
            font-size: 0.7rem;
            margin-top: 8px;
            font-weight: 600;
            display: none;
        }

        /* BOTÓN ESTÁNDAR UNIFICADO (IGUAL A LOGOTIPOS) */
        .download-btn {
            display: block;
            width: 100%;
            padding: 18px 0; /* Ajustado para el tamaño de la referencia */
            background-color: transparent;
            border: 1.5px solid var(--cb-tan);
            color: var(--cb-tan);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem; /* Un poco más grande para legibilidad */
            font-weight: 700;
            transition: all 0.3s ease;
            box-sizing: border-box;
            text-align: center;
        }

        .download-btn:hover {
            background-color: var(--cb-tan);
            color: white;
            box-shadow: 0 5px 15px rgba(185, 147, 108, 0.3);
        }

        @media (max-width: 768px) { .flyers-comparison { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="nav-back">
        <a href="index.html">← Volver al Panel</a>
    </nav>

    <div class="container">
        <header>
            <h1>Flyers</h1>
            <p style="color: var(--cb-stone);">Envía tus comentarios directamente a nuestro equipo.</p>
        </header>

        <main class="flyers-comparison">
            <!-- VERSIÓN 1 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 1.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV1.jpg" alt="Flyer V1">
                </div>
                <div class="comment-section">
                    <form onsubmit="botWhatsApp(event, '1.0', 'input-v1', 'status-v1')">
                        <div class="comment-box">
                            <input type="text" id="input-v1" placeholder="Comentarios sobre V1..." required>
                            <button type="submit" class="send-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
                            </button>
                        </div>
                        <div id="status-v1" class="status-msg"></div>
                    </form>
                </div>
                <a href="recursos/flyers/FlyerCB_AbrilV1.jpg" download class="download-btn">Descargar JPG</a>
            </article>

            <!-- VERSIÓN 2 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 2.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV2.jpg" alt="Flyer V2">
                </div>
                <div class="comment-section">
                    <form onsubmit="botWhatsApp(event, '2.0', 'input-v2', 'status-v2')">
                        <div class="comment-box">
                            <input type="text" id="input-v2" placeholder="Comentarios sobre V2..." required>
                            <button type="submit" class="send-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
                            </button>
                        </div>
                        <div id="status-v2" class="status-msg"></div>
                    </form>
                </div>
                <a href="recursos/flyers/FlyerCB_AbrilV2.jpg" download class="download-btn">Descargar JPG</a>
            </article>

            <!-- VERSIÓN 3 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 3.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV3.jpg" alt="Flyer V3">
                </div>
                <div class="comment-section">
                    <form onsubmit="botWhatsApp(event, '3.0', 'input-v3', 'status-v3')">
                        <div class="comment-box">
                            <input type="text" id="input-v3" placeholder="Comentarios sobre V3..." required>
                            <button type="submit" class="send-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
                            </button>
                        </div>
                        <div id="status-v3" class="status-msg"></div>
                    </form>
                </div>
                <a href="recursos/flyers/FlyerCB_AbrilV3.jpg" download class="download-btn">Descargar JPG</a>
            </article>
        </main>
    </div>

    <script>
        function botWhatsApp(event, version, inputId, statusId) {
            event.preventDefault();
            const input = document.getElementById(inputId);
            const status = document.getElementById(statusId);
            const comment = input.value;

            status.style.display = "block";
            status.innerText = "Enviando...";
            status.style.color = "var(--cb-stone)";

            const phone = "584242623012";
            const apikey = "2641876";
            const text = encodeURIComponent(`*Feedback Caracas Bakery*\n*Flyer:* ${version}\n*Comentario:* ${comment}`);

            const url = `https://api.callmebot.com/whatsapp.php?phone=${phone}&text=${text}&apikey=${apikey}`;

            fetch(url, { mode: 'no-cors' })
                .then(() => {
                    status.innerText = "¡Enviado!";
                    status.style.color = "var(--cb-tan)";
                    input.value = "";
                    setTimeout(() => { status.style.display = "none"; }, 4000);
                })
                .catch(() => {
                    status.innerText = "Error.";
                    status.style.color = "#dc3545";
                });
        }
    </script>
</body>
</html>
