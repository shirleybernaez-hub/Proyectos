<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Fichas Técnicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

        header#main-header {
            width: 100%;
            padding: 10px 0 0 0;
            text-align: center;
        }

        .logo-kantal {
            height: auto;
            display: inline-block;
            width: 220px; 
            margin-bottom: -15px;
        }

        @media (min-width: 768px) {
            .logo-kantal { width: 450px; }
        }

        .content-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 60px 20px; 
        }

        /* NAVEGACIÓN POR CATEGORÍAS (TABS) */
        .tabs-container {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
            padding: 10px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-button {
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 20px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-button.active {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }

        /* CONTROL DE VISIBILIDAD */
        .category-content { display: none; }
        .category-content.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ESTILO DE CARD Y CHAT */
        .product-card {
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 20px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-input-container {
            background-color: #f3f4f6;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 56px;
        }
        .chat-field { background: transparent; border: none; outline: none; flex-grow: 1; font-size: 14px; }
        .btn-download { border: 1.5px solid black; transition: all 0.3s ease; font-size: 9px; text-align: center; }
        .btn-download:hover { background: black; color: white; }
    </style>
</head>
<body>

    <header id="main-header">
        <img src="logo/logokantal.svg" class="logo-kantal" alt="Kantal Logo">
    </header>

    <div class="content-wrapper">
        <div class="text-center mb-6">
            <h2 class="text-2xl md:text-3xl font-black tracking-tighter uppercase mb-0">Fichas técnicas</h2>
            <p class="text-zinc-400 text-[9px] md:text-[10px] uppercase tracking-[0.4em]">Documentación oficial de productos</p>
        </div>

        <!-- MENÚ DE CATEGORÍAS -->
        <nav class="tabs-container">
            <button class="tab-button active" onclick="openTab(event, 'cat-cosmetica')">Línea Cosmética</button>
            <button class="tab-button" onclick="openTab(event, 'cat-productos')">Productos Perros/Gatos</button>
            <button class="tab-button" onclick="openTab(event, 'cat-galletas')">Súper Galletas</button>
            <button class="tab-button" onclick="openTab(event, 'cat-arena')">Arena Gatos</button>
            <button class="tab-button" onclick="openTab(event, 'cat-aves')">Aves</button>
            <button class="tab-button" onclick="openTab(event, 'cat-peces')">Peces/Tortugas</button>
            <button class="tab-button" onclick="openTab(event, 'cat-roedores')">Roedores</button>
            <button class="tab-button" onclick="openTab(event, 'cat-alimento')">Alimento Perros</button>
        </nav>

        <!-- CONTENIDO: LÍNEA COSMÉTICA -->
        <div id="cat-cosmetica" class="category-content active">
            <div class="mb-6"><h3 class="text-xl font-black uppercase">Línea Cosmética</h3><div class="h-1 w-12 bg-black"></div></div>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Aquí van las 5 cards que ya tenemos de Perros y Gatos -->
                <article class="product-card">
                    <h4 class="text-[12px] font-bold uppercase text-zinc-500">Enjuague desenredante</h4>
                    <div class="w-full bg-[#f9f9f9] p-3 rounded-xl"><img src="fichas/perrosygatos/Enjuage desenredante.jpg" class="w-full h-auto"></div>
                    <div class="flex flex-col gap-3">
                        <a href="fichas/perrosygatos/Enjuage desenredante.pdf" download class="btn-download px-6 py-2.5 font-black rounded-full">Descargar PDF</a>
                        <form class="chat-form"><div class="chat-input-container"><input type="text" placeholder="Escribe tus comentarios" class="chat-field"><button type="submit" class="text-zinc-400"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button></div></form>
                    </div>
                </article>
            </section>
        </div>

        <!-- CONTENIDO: PRODUCTOS PERROS Y GATOS -->
        <div id="cat-productos" class="category-content">
            <div class="mb-6"><h3 class="text-xl font-black uppercase">Productos para Perros y Gatos</h3><div class="h-1 w-12 bg-black"></div></div>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <p class="text-zinc-400 italic text-sm">Cargando fichas técnicas...</p>
            </section>
        </div>

        <!-- Las demás categorías siguen la misma estructura de ID -->
        <div id="cat-galletas" class="category-content">
            <div class="mb-6"><h3 class="text-xl font-black uppercase">Súper Galletas</h3><div class="h-1 w-12 bg-black"></div></div>
            <p class="text-zinc-400 italic text-sm">Próximamente...</p>
        </div>

        <div id="cat-arena" class="category-content">
            <div class="mb-6"><h3 class="text-xl font-black uppercase">Arena para Gatos</h3><div class="h-1 w-12 bg-black"></div></div>
            <p class="text-zinc-400 italic text-sm">Próximamente...</p>
        </div>

    </div>

    <script>
        function openTab(evt, tabId) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("category-content");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].classList.remove("active"); }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].classList.remove("active"); }
            document.getElementById(tabId).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        document.querySelectorAll('.chat-form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = form.querySelector('.chat-field');
                input.placeholder = "Enviando...";
                try {
                    const response = await fetch('https://formspree.io/f/xvzlravo', {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });
                    if (response.ok) { input.value = ""; input.placeholder = "¡Recibido!"; }
                    setTimeout(() => input.placeholder = "Escribe tus comentarios", 3000);
                } catch (err) { input.placeholder = "Error"; }
            });
        });
    </script>
</body>
</html>
