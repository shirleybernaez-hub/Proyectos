<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Recursos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; }
        .reveal { animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes reveal { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .btn-hover:hover { background-color: #000; color: #fff; transform: scale(1.02); }
    </style>
</head>
<body class="antialiased">

    <!-- HERO -->
    <section class="h-[45vh] flex flex-col justify-center items-center text-center px-6">
        <div class="mb-4">
            <!-- Ruta exacta: logokantal.svg -->
            <img src="logo/logokantal.svg" alt="Kantal" class="reveal w-48 md:w-56">
        </div>
        <div class="opacity-60 reveal" style="animation-delay: 0.3s;">
            <!-- Ruta exacta: slogankantal.png -->
            <img src="logo/slogankantal.png" alt="Slogan" class="w-32 md:w-40 mx-auto">
        </div>
    </section>

    <!-- FICHAS -->
    <main class="max-w-5xl mx-auto py-12 px-6">
        <header class="mb-24 text-center">
            <h2 class="text-6xl md:text-8xl font-black tracking-tighter uppercase leading-[0.8] mb-6">Ficha Técnica</h2>
            <div class="h-1 w-20 bg-black mx-auto"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-20">
            <div class="group">
                <div class="bg-[#f7f7f7] aspect-[4/5] flex items-center justify-center p-12 transition-all duration-700 group-hover:bg-[#f0f0f0]">
                    <!-- Ruta exacta: ficha_perros_gatos.jpg -->
                    <img src="fichas/perrosygatos/ficha_perros_gatos.jpg" 
                         alt="Ficha Perros y Gatos" 
                         class="w-full h-full object-contain mix-blend-multiply transition-transform duration-700 group-hover:scale-105">
                </div>
                
                <div class="mt-10">
                    <h3 class="text-[14px] font-black uppercase tracking-[0.3em] mb-6">Línea Perros y Gatos</h3>
                    <a href="fichas/perrosygatos/ficha_perros_gatos.pdf" download 
                       class="btn-hover inline-block border-2 border-black px-12 py-4 text-[10px] font-black uppercase tracking-[0.2em] transition-all duration-300">
                        Descargar PDF
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-20 text-center text-zinc-300 text-[10px] font-bold uppercase tracking-[0.5em]">
        Kantal Food 2026
    </footer>

</body>
</html>
