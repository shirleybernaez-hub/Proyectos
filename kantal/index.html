<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Panel de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        header#main-header { width: 100%; padding: 10px 0 0 0; text-align: center; }
        .logo-kantal { height: auto; display: inline-block; width: 220px; margin-bottom: -15px; }
        @media (min-width: 768px) { .logo-kantal { width: 450px; } }
        .content-wrapper { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px 20px; }
        .search-container { max-width: 600px; margin: 0 auto 30px auto; position: relative; }
        .search-input { width: 100%; padding: 14px 24px; border-radius: 30px; border: 1px solid #e5e7eb; background-color: #f9f9f9; font-size: 14px; outline: none; transition: all 0.3s ease; }
        .category-title { color: #9E2300; }
        .tabs-container { display: flex; overflow-x: auto; white-space: nowrap; gap: 8px; padding: 10px 0; margin-bottom: 30px; border-bottom: 1px solid #eee; scrollbar-width: none; }
        .tab-button { padding: 8px 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 20px; border: 1px solid #e5e7eb; cursor: pointer; transition: all 0.3s ease; }
        .tab-button.active { background-color: #000; color: #fff; border-color: #000; }
        .category-content { display: none; }
        .category-content.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .product-card { border: 1px solid #e5e7eb; border-radius: 24px; padding: 20px; background: #fff; display: flex; flex-direction: column; gap: 16px; }
        .comment-box { background: #f9f9f9; border-radius: 16px; padding: 12px; margin-top: 10px; max-height: 200px; overflow-y: auto; font-size: 12px; }
        .comment-item { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-pending { background-color: #ef4444; }
        .status-done { background-color: #22c55e; }
        .btn-download { border: 1.5px solid black; transition: all 0.3s ease; font-size: 9px; text-align: center; }
        .btn-download:hover { background: black; color: white; }
    </style>
</head>
<body>

    <header id="main-header">
        <img src="logo/logokantal.svg" class="logo-kantal" alt="Kantal Logo">
    </header>

    <div class="content-wrapper">
        <div class="text-center mb-6">
            <h2 class="text-2xl md:text-3xl font-black tracking-tighter uppercase mb-0">Panel de Gestión de Fichas</h2>
            <p class="text-zinc-400 text-[9px] md:text-[10px] uppercase tracking-[0.4em]">Revisiones y Feedback en tiempo real</p>
        </div>

        <div class="search-container">
            <input type="text" id="productSearch" class="search-input" placeholder="Buscar producto..." onkeyup="filterProducts()">
        </div>

        <nav class="tabs-container" id="tabsNav">
            <button class="tab-button active" onclick="openTab(event, 'cat-cosmetica')">Línea Cosmética (6)</button>
            <button class="tab-button" onclick="openTab(event, 'cat-productos')">Productos Perros/Gatos (10)</button>
            <button class="tab-button" onclick="openTab(event, 'cat-aves')">Aves (1)</button>
            <button class="tab-button" onclick="openTab(event, 'cat-roedores')">Roedores (1)</button>
        </nav>

        <div id="cat-cosmetica" class="category-content active">
            <div class="mb-6"><h3 class="text-xl font-black uppercase category-title">Línea Cosmética (6)</h3><div class="h-1 w-12 bg-black"></div></div>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <script>
                    function renderCard(id, name, img, pdf, folder) {
                        document.write(`
                            <article class="product-card" data-id="${id}">
                                <h4 class="text-[12px] font-bold uppercase product-name">${name}</h4>
                                <div class="w-full bg-[#f9f9f9] p-3 rounded-xl"><img src="fichas/${folder}/${img}" class="w-full h-auto object-contain"></div>
                                <a href="fichas/${folder}/${pdf}" download class="btn-download px-6 py-2.5 font-black rounded-full">Descargar PDF</a>
                                
                                <div class="comment-section">
                                    <p class="text-[10px] font-bold uppercase mb-2">Historial de cambios:</p>
                                    <div id="list-${id}" class="comment-box text-zinc-500">Cargando comentarios...</div>
                                    <div class="flex gap-2 mt-3">
                                        <input type="text" id="input-${id}" placeholder="Escribir observación..." class="flex-grow bg-zinc-100 border-none rounded-full px-4 py-2 text-xs outline-none">
                                        <button onclick="sendComment('${id}')" class="bg-black text-white rounded-full px-4 text-xs font-bold">Enviar</button>
                                    </div>
                                </div>
                            </article>
                        `);
                    }
                    
                    renderCard('cosm-enjuague', 'Enjuague desenredante', 'Enjuage desenredante.jpg', 'Enjuage desenredante.pdf', 'perrosygatos');
                    renderCard('cosm-champu', 'Champú cosmético', 'champucosmetico.jpg', 'champucosmetico.pdf', 'perrosygatos');
                    renderCard('cosm-cachorros', 'Colonia cachorros', 'coloniacachorros.jpg', 'coloniacachorros.pdf', 'perrosygatos');
                    renderCard('cosm-perrosgatos', 'Colonia perros y gatos', 'coloniaperrosygatos.jpg', 'coloniaperrosygatos.pdf', 'perrosygatos');
                    renderCard('cosm-machos', 'Colonia machos', 'coloniamachos.jpg', 'coloniamachos.pdf', 'perrosygatos');
                    renderCard('cosm-180', 'Champú 180', 'champu180.jpg', 'champu180.pdf', 'perrosygatos');
                </script>
            </section>
        </div>

        <div id="cat-productos" class="category-content">
            <div class="mb-6"><h3 class="text-xl font-black uppercase category-title">Productos Perros y Gatos (10)</h3><div class="h-1 w-12 bg-black"></div></div>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <script>
                    renderCard('prod-antimord', 'Antimordeduras', 'antimordeduras.jpg', 'antimordeduras.pdf', 'productos_perros_gatos');
                    renderCard('prod-antipara', 'Antiparasitario', 'antiparasitario.jpg', 'antiparasitario.pdf', 'productos_perros_gatos');
                    renderCard('prod-ch-anti', 'Champú Antipulgas', 'champu antipulgas.jpg', 'champu antipulgas.pdf', 'productos_perros_gatos');
                    renderCard('prod-ciper', 'Ciper Baño', 'Ciper bano.jpg', 'Ciper bano.pdf', 'productos_perros_gatos');
                    renderCard('prod-garra', 'Garrapaticida', 'garrapaticida.jpg', 'garrapaticida.pdf', 'productos_perros_gatos');
                    renderCard('prod-jabon', 'Jabón de Azufre', 'jabon de azufre.jpg', 'jabon de azufre.pdf', 'productos_perros_gatos');
                    renderCard('prod-ultra', 'Matagusanos Ultra', 'matagusanos ultra.jpg', 'matagusanos ultra.pdf', 'productos_perros_gatos');
                    renderCard('prod-mata', 'Matagusanos', 'matagusanos.jpg', 'matagusanos.pdf', 'productos_perros_gatos');
                    renderCard('prod-repel', 'Repelente', 'repelente.jpg', 'repelente.pdf', 'productos_perros_gatos');
                    renderCard('prod-talco', 'Talco Antipulgas', 'talco antipulgas.jpg', 'talco antipulgas.pdf', 'productos_perros_gatos');
                </script>
            </section>
        </div>

        <div id="cat-aves" class="category-content">
            <div class="mb-6"><h3 class="text-xl font-black uppercase category-title">Línea Aves (1)</h3><div class="h-1 w-12 bg-black"></div></div>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <script>renderCard('aves-anti', 'Antiparasitario Pájaros', 'antiparasitariopajaros.jpg', 'antiparasitariopajaros.pdf', 'aves');</script>
            </section>
        </div>

        <div id="cat-roedores" class="category-content">
            <div class="mb-6"><h3 class="text-xl font-black uppercase category-title">Línea Roedores (1)</h3><div class="h-1 w-12 bg-black"></div></div>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <script>renderCard('roe-hamster', 'Alimento Hamster', 'alimentohamster.jpg', 'alimentohamster.pdf', 'roedores');</script>
            </section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCisKAs5PsiuP18OlpBS2PMdxh9IePKlR8",
            authDomain: "kantal-fichas.firebaseapp.com",
            projectId: "kantal-fichas",
            storageBucket: "kantal-fichas.firebasestorage.app",
            messagingSenderId: "69901829645",
            appId: "1:69901829645:web:ba112e75efd6b7e1cc3744",
            databaseURL: "https://kantal-fichas-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función global para enviar comentarios
        window.sendComment = function(productId) {
            const input = document.getElementById(`input-${productId}`);
            const text = input.value.trim();
            if (text === "") return;

            const commentRef = ref(db, `comments/${productId}`);
            push(commentRef, {
                text: text,
                status: 'pending',
                date: new Date().toLocaleString()
            });
            input.value = "";
        };

        // Escuchar comentarios en tiempo real para todos los productos
        const productIds = ['cosm-enjuague', 'cosm-champu', 'cosm-cachorros', 'cosm-perrosgatos', 'cosm-machos', 'cosm-180', 'prod-antimord', 'prod-antipara', 'prod-ch-anti', 'prod-ciper', 'prod-garra', 'prod-jabon', 'prod-ultra', 'prod-mata', 'prod-repel', 'prod-talco', 'aves-anti', 'roe-hamster'];

        productIds.forEach(id => {
            const listDiv = document.getElementById(`list-${id}`);
            onValue(ref(db, `comments/${id}`), (snapshot) => {
                listDiv.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        const div = document.createElement('div');
                        div.className = "comment-item";
                        div.innerHTML = `
                            <span><span class="status-dot ${item.status === 'pending' ? 'status-pending' : 'status-done'}"></span>${item.text}</span>
                            <span class="text-[8px] text-zinc-400">${item.date}</span>
                        `;
                        // Si tú haces clic en el comentario, se marca como resuelto
                        div.onclick = () => {
                            const newStatus = item.status === 'pending' ? 'done' : 'pending';
                            update(ref(db, `comments/${id}/${key}`), { status: newStatus });
                        };
                        listDiv.appendChild(div);
                    });
                } else {
                    listDiv.innerHTML = "Sin observaciones.";
                }
            });
        });
    </script>

    <script>
        function openTab(evt, tabId) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("category-content");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].classList.remove("active"); }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].classList.remove("active"); }
            document.getElementById(tabId).classList.add("active");
            if(evt) evt.currentTarget.classList.add("active");
        }
        function filterProducts() {
            const input = document.getElementById('productSearch');
            const filter = input.value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                const name = cards[i].querySelector('.product-name').innerText.toLowerCase();
                cards[i].style.display = name.includes(filter) ? "flex" : "none";
            }
        }
    </script>
</body>
</html>
