<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyers | Caracas Bakery</title>
    <style>
        /* Paleta oficial de colores.jpg */
        :root {
            --cb-tan: #B9936C;
            --cb-charcoal: #434244;
            --cb-stone: #BDB5AD;
            --cb-cream: #EBE1D5;
            --bg-light: #FAFAFA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--cb-charcoal);
        }

        /* Breadcrumbs estilo ONSHIFT */
        .nav-back {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-back a {
            text-decoration: none;
            color: var(--cb-tan);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: opacity 0.3s ease;
        }

        .nav-back a:hover { opacity: 0.7; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
            text-align: center;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .helper-text {
            color: var(--cb-stone);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        /* Grid para 3 columnas en Desktop */
        .flyers-comparison {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            align-items: start;
        }

        .flyer-item {
            background: white;
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .flyer-item:hover {
            transform: translateY(-5px);
        }

        .version-badge {
            display: inline-block;
            background-color: var(--cb-cream);
            color: var(--cb-tan);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            align-self: center;
        }

        .image-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            background-color: var(--cb-cream);
            line-height: 0;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* --- Caja de Comentarios Estilo Chat In-Page --- */
        .comment-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .comment-box {
            display: flex;
            align-items: center;
            background: #F4F4F4;
            border-radius: 20px;
            padding: 10px 15px;
            border: 1px solid #EAEAEA;
            transition: all 0.3s ease;
        }

        .comment-box:focus-within {
            border-color: var(--cb-tan);
            background: white;
            box-shadow: 0 0 0 3px rgba(185, 147, 108, 0.1);
        }

        .comment-box input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            padding: 5px;
            color: var(--cb-charcoal);
        }

        .send-btn {
            background: var(--cb-tan);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.1);
            background: var(--cb-charcoal);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            color: white;
        }

        .status-msg {
            font-size: 0.7rem;
            margin-top: 8px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: transparent;
            border: 2px solid var(--cb-tan);
            color: var(--cb-tan);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-sizing: border-box;
            letter-spacing: 1px;
            text-align: center;
        }

        .download-btn:hover {
            background-color: var(--cb-tan);
            color: white;
            box-shadow: 0 5px 15px rgba(185, 147, 108, 0.3);
        }

        @media (max-width: 768px) {
            .flyers-comparison { grid-template-columns: 1fr; }
            .flyer-item { padding: 20px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-back">
        <a href="index.html">← Volver al Panel</a>
    </nav>

    <div class="container">
        <header>
            <h1>Flyers</h1>
            <p class="helper-text">Envía tus comentarios sobre cada versión para realizar ajustes.</p>
        </header>

        <main class="flyers-comparison">
            
            <!-- VERSIÓN 1 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 1.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV1.jpg" alt="Flyer Abril V1">
                </div>
                
                <div class="comment-section">
                    <form onsubmit="submitComment(event, '1.0', 'input-v1', 'status-v1')">
                        <div class="comment-box">
                            <input type="text" id="input-v1" placeholder="¿Qué te parece la V1?" required>
                            <button type="submit" class="send-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                                </svg>
                            </button>
                        </div>
                        <div id="status-v1" class="status-msg"></div>
                    </form>
                </div>

                <a href="recursos/flyers/FlyerCB_AbrilV1.jpg" download class="download-btn">Descargar JPG</a>
            </article>

            <!-- VERSIÓN 2 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 2.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV2.jpg" alt="Flyer Abril V2">
                </div>

                <div class="comment-section">
                    <form onsubmit="submitComment(event, '2.0', 'input-v2', 'status-v2')">
                        <div class="comment-box">
                            <input type="text" id="input-v2" placeholder="¿Qué te parece la V2?" required>
                            <button type="submit" class="send-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                                </svg>
                            </button>
                        </div>
                        <div id="status-v2" class="status-msg"></div>
                    </form>
                </div>

                <a href="recursos/flyers/FlyerCB_AbrilV2.jpg" download class="download-btn">Descargar JPG</a>
            </article>

            <!-- VERSIÓN 3 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 3.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV3.jpg" alt="Flyer Abril V3">
                </div>

                <div class="comment-section">
                    <form onsubmit="submitComment(event, '3.0', 'input-v3', 'status-v3')">
                        <div class="comment-box">
                            <input type="text" id="input-v3" placeholder="¿Qué te parece la V3?" required>
                            <button type="submit" class="send-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                                </svg>
                            </button>
                        </div>
                        <div id="status-v3" class="status-msg"></div>
                    </form>
                </div>

                <a href="recursos/flyers/FlyerCB_AbrilV3.jpg" download class="download-btn">Descargar JPG</a>
            </article>

        </main>
    </div>

    <script>
        async function submitComment(event, version, inputId, statusId) {
            event.preventDefault();
            const input = document.getElementById(inputId);
            const status = document.getElementById(statusId);
            const comment = input.value;

            // Estado de carga visual
            status.style.display = "block";
            status.innerText = "Enviando comentario...";
            status.style.color = "var(--cb-stone)";

            try {
                // Endpoint con tu ID de Formspree: mqenqolb
                const response = await fetch("https://formspree.io/f/mqenqolb", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        Marca: "Caracas Bakery",
                        Seccion: "Feedback Flyers",
                        Version: version, 
                        Mensaje: comment 
                    })
                });

                if (response.ok) {
                    status.innerText = "¡Recibido! Revisaremos tus ajustes.";
                    status.style.color = "var(--cb-tan)"; 
                    input.value = ""; 
                    
                    // Ocultar mensaje después de unos segundos
                    setTimeout(() => { status.style.display = "none"; }, 4000);
                } else {
                    throw new Error();
                }
            } catch (error) {
                status.innerText = "Error de conexión. Intenta de nuevo.";
                status.style.color = "#dc3545";
            }
        }
    </script>

</body>
</html>
