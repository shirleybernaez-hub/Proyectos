<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyers | Caracas Bakery</title>
    <style>
        :root {
            --cb-tan: #B9936C;
            --cb-charcoal: #434244;
            --cb-stone: #BDB5AD;
            --cb-cream: #EBE1D5;
            --bg-light: #FAFAFA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--cb-charcoal);
        }

        .nav-back {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-back a {
            text-decoration: none;
            color: var(--cb-tan);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
            text-align: center;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .helper-text {
            color: var(--cb-stone);
            font-size: 0.9rem;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Grid Optimizado para Comparación */
        .flyers-comparison {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            align-items: start;
        }

        .flyer-item {
            background: white;
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .flyer-item:hover {
            transform: translateY(-5px);
        }

        .version-badge {
            display: inline-block;
            background-color: var(--cb-cream);
            color: var(--cb-tan);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .image-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            background-color: var(--cb-cream);
            line-height: 0; /* Quita espacio extra inferior */
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .flyer-info {
            text-align: left;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .flyer-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            color: var(--cb-charcoal);
        }

        .flyer-info p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--cb-stone);
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: transparent;
            border: 2px solid var(--cb-tan);
            color: var(--cb-tan);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .download-btn:hover {
            background-color: var(--cb-tan);
            color: white;
        }

        @media (max-width: 768px) {
            .flyers-comparison {
                grid-template-columns: 1fr;
            }
            .flyer-item {
                padding: 15px;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-back">
        <a href="index.html">← Volver al Panel</a>
    </nav>

    <div class="container">
        <header>
            <h1>Flyers</h1>
            <div class="helper-text">
                <span>Versiones disponibles para la campaña de Abril</span>
            </div>
        </header>

        <main class="flyers-comparison">
            
            <!-- VERSIÓN 1 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 1.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV1.jpg" alt="Flyer Caracas Bakery Abril V1">
                </div>
                <div class="flyer-info">
                    <h3>Pizzas Artesanales</h3>
                    <p>Enfoque en fotografía de producto y branding principal.</p>
                </div>
                <a href="recursos/flyers/FlyerCB_AbrilV1.jpg" download class="download-btn">Descargar JPG</a>
            </article>

            <!-- VERSIÓN 2 -->
            <article class="flyer-item">
                <span class="version-badge">Versión 2.0</span>
                <div class="image-container">
                    <img src="recursos/flyers/FlyerCB_AbrilV2.jpg" alt="Flyer Caracas Bakery Abril V2">
                </div>
                <div class="flyer-info">
                    <h3>Variante Promocional</h3>
                    <p>Diseño optimizado para legibilidad en redes sociales.</p>
                </div>
                <a href="recursos/flyers/FlyerCB_AbrilV2.jpg" download class="download-btn">Descargar JPG</a>
            </article>

        </main>
    </div>

</body>
</html>
