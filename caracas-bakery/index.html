<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Assets | Caracas Bakery</title>
   <style>
    :root {
        --bg-color: #FFFFFF;
        --accent: #f4f4f4;
        /* Colores de la paleta colores.jpg */
        --cb-tan: #B9936C;
        --cb-cream: #EBE1D5;
        --cb-charcoal: #434244;
        --cb-taupe: #8C7E74;
        --cb-stone: #BDB5AD;
    }

    body {
        background-color: var(--bg-color);
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
    }

    header {
        width: 100%;
        padding: 80px 0 60px 0;
        text-align: center;
    }

    .logo-bakery {
        max-height: 120px; 
        width: auto;
        transition: transform 0.3s ease;
    }

    .grid-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px 80px 20px;
    }

    .bento-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 220px; 
        gap: 20px;
    }

    .bento-item {
        background-color: var(--accent);
        border-radius: 24px;
        padding: 30px;
        text-decoration: none;
        color: #000;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        text-align: right;
        box-sizing: border-box;
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    .bento-item:hover {
        transform: scale(1.02);
        filter: brightness(0.95);
    }

    /* Aplicación de colores según colores.jpg */
    
    /* 1. BRANDBOOK - Tan con opacidad baja */
    .color-1 { background-color: rgba(185, 147, 108, 0.25) !important; color: #6d4c2b; }
    
    /* 2. LOGOTIPOS - Cream */
    .color-2 { background-color: var(--cb-cream) !important; }
    
    /* 3. MENÚ - Charcoal (Texto Blanco) */
    .color-3 { background-color: var(--cb-charcoal) !important; color: #FFFFFF !important; }
    .color-3 p { color: #FFFFFF; opacity: 0.8 !important; }
    
    /* 4. FLYERS - Taupe (Texto Blanco) */
    .color-4 { background-color: var(--cb-taupe) !important; color: #FFFFFF !important; }
    .color-4 p { color: #FFFFFF; opacity: 0.8 !important; }
    
    /* 5. MERCH - Stone */
    .color-5 { background-color: var(--cb-stone) !important; }
    
    /* 6. STICKERS - Repetimos Tan (Sólido) */
    .color-6 { background-color: var(--cb-tan) !important; color: #FFFFFF !important; }
    .color-6 p { color: #FFFFFF; opacity: 0.8 !important; }

    .bento-item h3 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .bento-item p {
        margin: 5px 0 0 0;
        font-size: 0.85rem;
        opacity: 0.6;
    }

    .item-large { grid-column: span 2; grid-row: span 2; }
    .item-wide { grid-column: span 2; }

    @media (max-width: 768px) {
        header { padding: 60px 0 40px 0; }
        .logo-bakery { max-height: 90px; }
        .bento-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
        .item-large, .item-wide { grid-column: span 1; grid-row: span 1; }
        .bento-item { min-height: 180px; }
    }
</style>

</head>
<body>

    <header>
    <img src="recursos/logo-caracas-bakery.png" class="logo-bakery">
</header>

<div class="grid-container">
    <main class="bento-grid">
        
        <!-- 1. BRANDBOOK (Tan con opacidad) -->
        <a href="brandbook.html" class="bento-item item-large color-1">
            <h3>BRANDBOOK</h3>
            <p>Manual de identidad completo</p>
        </a>

        <!-- 2. LOGOTIPOS (Cream) -->
        <a href="logos.html" class="bento-item color-2">
            <h3>LOGOTIPOS</h3>
            <p>Variantes (PNG, SVG, JPG)</p>
        </a>

        <!-- 3. MENÚ (Charcoal / Texto Blanco) -->
        <a href="menu.html" class="bento-item color-3">
            <h3>MENÚ</h3>
            <p>Menú digital, CB y pizzas</p>
        </a>

        <!-- 4. FLYERS (Taupe / Texto Blanco) -->
        <a href="flyers.html" class="bento-item color-4">
            <h3>FLYERS</h3>
            <p>Promociones y eventos</p>
        </a>

        <!-- 5. MERCH (Stone) -->
        <a href="merch.html"  class="bento-item color-5">
            <h3>MERCH</h3>
            <p>Franelas y delantales</p>
        </a>

        <!-- 6. STICKERS (Tan Sólido) -->
        <a href="stickers.html" class="bento-item color-6">
            <h3>STICKERS</h3>
            <p>Diseños para empaque</p>
        </a>

        <!-- 7. PATRONES (Cream) -->
        <a href="patrones.html" class="bento-item item-wide color-2">
            <h3>PATRONES</h3>
            <p>Texturas de marca e identidad visual</p>
        </a>

        <!-- 8. ROTULACIONES (Stone) -->
        <a href="rotulaciones.html"  class="bento-item color-5">
            <h3>ROTULACIONES</h3>
            <p>Piezas gráficas para decoración</p>
        </a>
    </main>
</div>

</body>
</html>
