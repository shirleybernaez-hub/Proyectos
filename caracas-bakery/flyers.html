<!-- Cargar Tailwind CSS si no está en el proyecto -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    :root {
        --cb-tan: #B9936C;
        --cb-charcoal: #434244;
        --cb-stone: #BDB5AD;
        --cb-cream: #EBE1D5;
        --card-swap-duration: 300ms;
    }

    .image-card {
        transition: transform var(--card-swap-duration) ease, opacity var(--card-swap-duration) ease;
        transform-style: preserve-3d;
    }

    /* Estilos de profundidad basados en el índice --i */
    .image-card {
        transform: perspective(700px) 
                   translateZ(calc(-12px * var(--i))) 
                   translateY(calc(7px * var(--i))) 
                   translateX(var(--swipe-x, 0px)) 
                   rotateY(var(--swipe-rotate, 0deg));
    }
</style>

<div class="container mx-auto px-4 py-10 text-center">
    <header class="mb-10">
        <h1 class="text-4xl font-extrabold tracking-tight text-[#434244]">Flyers Interactivos</h1>
        <p class="text-[#BDB5AD] mt-2">Desliza para explorar nuestras promociones de Abril</p>
    </header>

    <!-- Swiper Container -->
    <div class="flex flex-col items-center justify-center min-h-[500px]">
        <section id="flyer-stack" class="relative grid place-content-center select-none touch-none" 
                 style="width: 300px; height: 400px; transform-style: preserve-3d;">
            
            <!-- Los flyers se insertan dinámicamente aquí -->
            
        </section>

        <!-- Botón de descarga dinámico -->
        <div class="mt-12">
            <a id="download-link" href="#" download class="inline-block px-10 py-4 border-2 border-[#B9936C] text-[#B9936C] rounded-full font-bold uppercase tracking-widest hover:bg-[#B9936C] hover:text-white transition-all shadow-lg">
                Descargar Flyer Actual
            </a>
        </div>
    </div>
</div>

<script>
    const images = [
        "recursos/flyers/FlyerCB_AbrilV1.jpg",
        "recursos/flyers/FlyerCB_AbrilV2.jpg",
        "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1000&auto=format&fit=crop" // Unsplash Pizza Stock
    ];

    let cardOrder = [...images.keys()];
    const stack = document.getElementById('flyer-stack');
    const downloadLink = document.getElementById('download-link');

    function renderStack() {
        stack.innerHTML = '';
        cardOrder.forEach((originalIndex, displayIndex) => {
            const article = document.createElement('article');
            article.className = "image-card absolute inset-0 cursor-grab active:cursor-grabbing border border-slate-300 rounded-2xl shadow-xl overflow-hidden bg-white";
            article.style.setProperty('--i', displayIndex);
            article.style.zIndex = images.length - displayIndex;
            
            article.innerHTML = `
                <img src="${images[originalIndex]}" class="w-full h-full object-cover pointer-events-none select-none">
            `;
            stack.appendChild(article);
        });
        // Actualizar link de descarga con la imagen que queda arriba
        downloadLink.href = images[cardOrder[0]];
    }

    // Lógica de Swipe (Vanilla JS port de tu componente React)
    let isSwiping = false;
    let startX = 0;

    stack.addEventListener('pointerdown', (e) => {
        isSwiping = true;
        startX = e.clientX;
        const activeCard = stack.querySelector('.image-card:first-child');
        if (activeCard) activeCard.style.transition = 'none';
    });

    window.addEventListener('pointermove', (e) => {
        if (!isSwiping) return;
        const deltaX = e.clientX - startX;
        const activeCard = stack.querySelector('.image-card:first-child');
        
        if (activeCard) {
            activeCard.style.setProperty('--swipe-x', `${deltaX}px`);
            activeCard.style.setProperty('--swipe-rotate', `${deltaX * 0.1}deg`);
            activeCard.style.opacity = 1 - Math.min(Math.abs(deltaX) / 400, 0.5);

            if (Math.abs(deltaX) > 120) {
                handleSwipeEnd(Math.sign(deltaX));
            }
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isSwiping) return;
        const activeCard = stack.querySelector('.image-card:first-child');
        if (activeCard) {
            activeCard.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            activeCard.style.setProperty('--swipe-x', '0px');
            activeCard.style.setProperty('--swipe-rotate', '0deg');
            activeCard.style.opacity = '1';
        }
        isSwiping = false;
    });

    function handleSwipeEnd(direction) {
        isSwiping = false;
        const activeCard = stack.querySelector('.image-card:first-child');
        
        activeCard.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
        activeCard.style.setProperty('--swipe-x', `${direction * 500}px`);
        activeCard.style.opacity = '0';

        setTimeout(() => {
            cardOrder.push(cardOrder.shift());
            renderStack();
        }, 300);
    }

    renderStack();
</script>
