<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Catálogo de productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #ffffff;
            color: #000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }

        header img {
            width: 110px;
            height: auto;
        }

        .switch-btn {
            padding: 8px 18px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 20px;
            text-decoration: none;
            border: 1.5px solid #000;
            transition: all 0.2s;
        }
        .switch-btn.active {
            background-color: #000;
            color: #fff;
        }
        .switch-btn:not(.active) {
            background-color: #ffffff;
            color: #000;
        }
        .switch-btn:hover { opacity: 0.8; }

        .main-container {
            margin-top: 50px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .side-arrow {
            background: none;
            border: none;
            color: #b0b0b0;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            transition: color 0.2s;
            user-select: none;
            z-index: 50;
        }
        .side-arrow:hover { color: #555; }
        .side-arrow:active { transform: scale(0.95); }

        /* Contenedor principal con soporte 3D */
        .book-container {
            width: 960px;
            height: 600px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
            border: 1px solid #eaeaea;
            background: #ffffff;
        }

        .book-container.single-mode {
            width: 480px;
        }

        .spread-view {
            width: 100%;
            height: 100%;
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            background: #ffffff;
        }

        .spread-view::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #eaeaea;
            z-index: 10;
        }

        .page {
            width: 50%;
            height: 100%;
            background-color: #ffffff;
            background-image: linear-gradient(to right, #f4f4f4 0%, #ffffff 4%, #ffffff 96%, #f4f4f4 100%);
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
            border-radius: 0px;
        }

        .page-single-full {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            background-image: none;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border-radius: 0px;
        }

        .page-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .prod-image-container {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .prod-image {
            max-height: 220px;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.05));
        }

        .cat-tag {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #9E2300;
            margin-bottom: 6px;
        }

        .prod-title {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .prod-desc {
            font-size: 11px;
            color: #555;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Capa animada de giro de página 3D */
        .flipping-page {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 30;
            box-shadow: 10px 0 20px rgba(0,0,0,0.1);
        }

        .flipping-page.flip-to-left {
            transform: rotateY(-180deg);
            transform-origin: right center;
            left: 0;
        }

        .flipping-page.flip-to-right {
            transform: rotateY(180deg);
            transform-origin: left center;
            left: 50%;
        }

        .flipping-page .front, .flipping-page .back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .flipping-page .back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>

    <header>
        <div>
            <img src="logo/logokantal.png" alt="Kantal Logo">
        </div>

        <nav style="display: flex; gap: 10px;">
            <a href="index.html" class="switch-btn">Fichas Técnicas</a>
            <a href="catalogo.html" class="switch-btn active">Catálogo Revista</a>
        </nav>
    </header>

    <div class="main-container">
        <button class="side-arrow" onclick="turnPrev()">&#10094;</button>
        <div class="book-container single-mode" id="bookContainer">
            <div class="spread-view" id="spreadView">
                <!-- Renderizado dinámico -->
            </div>
        </div>
        <button class="side-arrow" onclick="turnNext()">&#10095;</button>
    </div>

    <script>
        const spreads = [
            {
                type: 'cover',
                html: `
                    <div class="page-single-full">
                        <div class="page-inner">
                            <img src="logo/logokantal.png" style="width: 180px; height: auto; margin-bottom: 25px;" alt="Logo Kantal">
                            <h1 style="font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: #666; margin-top: 0; margin-bottom: 15px; font-weight: 600;">CATÁLOGO DE PRODUCTOS</h1>
                        </div>
                    </div>
                `
            },
            {
                type: 'spread',
                left: `
                    <div class="page-inner" style="background: #ffffff; color: #000; width: 100%; height: 100%; padding: 30px;">
                        <img src="logo/logokantal.png" style="width: 120px; height: auto; margin-bottom: 15px;" alt="Logo Kantal">
                        <p style="font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: #666; margin-top: 8px;">Tradicionalmente Sano</p>
                    </div>
                `,
                right: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta de Carne</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/Supergalleta_carne.png" class="prod-image" alt="Súper Galleta de Carne">
                    </div>
                    <p class="prod-desc">Galletas horneadas con auténtico sabor a carne, ideales como premio nutritivo y energético para consentir a su mascota.</p>
                `
            },
            {
                type: 'spread',
                left: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta Cachorros</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalleta_cachorros.png" class="prod-image" alt="Súper Galleta Cachorros">
                    </div>
                    <p class="prod-desc">Fórmula especial de fácil digestión diseñada para el crecimiento saludable y la nutrición delicada de los cachorros.</p>
                `,
                right: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta de Queso</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalleta_queso.png" class="prod-image" alt="Súper Galleta de Queso">
                    </div>
                    <p class="prod-desc">Irresistible sabor a queso seleccionado, aportando calcio y un estímulo de sabor único que encantará a su perro.</p>
                `
            },
            {
                type: 'spread',
                left: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta de Pollo</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalletapollo.png" class="prod-image" alt="Súper Galleta de Pollo">
                    </div>
                    <p class="prod-desc">Bocados crujientes con exquisito sabor a pollo, ricos en proteínas de alta calidad para vitalidad diaria.</p>
                `,
                right: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galletas de Salmón</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalletas_salmon.png" class="prod-image" alt="Súper Galletas de Salmón">
                    </div>
                    <p class="prod-desc">Enriquecidas con ácidos grasos esenciales Omega 3 para un pelaje brillante y una salud cutánea superior.</p>
                `
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;

        function playPageSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = ctx.sampleRate * 0.12;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.04));
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 1.2;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.35, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                noise.start();
            } catch (e) {}
        }

        function renderSpread() {
            const container = document.getElementById('spreadView');
            const bookContainer = document.getElementById('bookContainer');
            const data = spreads[currentIndex];

            if (currentIndex === 0) {
                bookContainer.classList.add('single-mode');
                container.innerHTML = data.html;
            } else {
                bookContainer.classList.remove('single-mode');
                container.innerHTML = `
                    <div class="page">${data.left}</div>
                    <div class="page">${data.right}</div>
                `;
            }
        }

        function turnNext() {
            if (isAnimating || currentIndex >= spreads.length - 1) return;
            isAnimating = true;
            playPageSound();

            const bookContainer = document.getElementById('bookContainer');
            const currentData = spreads[currentIndex];
            const nextData = spreads[currentIndex + 1];

            // Crear hoja animada para doblado 3D
            const flipper = document.createElement('div');
            flipper.className = 'flipping-page flip-to-left';
            flipper.style.left = currentIndex === 0 ? '0px' : '50%';
            
            const frontHTML = currentIndex === 0 ? currentData.html : currentData.right;
            const backHTML = nextData.type === 'cover' ? '' : nextData.left;

            flipper.innerHTML = `
                <div class="front">${frontHTML}</div>
                <div class="back">${backHTML}</div>
            `;
            bookContainer.appendChild(flipper);

            setTimeout(() => {
                flipper.style.transform = 'rotateY(-180deg)';
            }, 20);

            setTimeout(() => {
                currentIndex++;
                renderSpread();
                flipper.remove();
                isAnimating = false;
            }, 600);
        }

        function turnPrev() {
            if (isAnimating || currentIndex <= 0) return;
            isAnimating = true;
            playPageSound();

            const bookContainer = document.getElementById('bookContainer');
            const currentData = spreads[currentIndex];
            const prevData = spreads[currentIndex - 1];

            const flipper = document.createElement('div');
            flipper.className = 'flipping-page flip-to-right';
            flipper.style.left = '0px';
            flipper.style.transform = 'rotateY(-180deg)';

            const frontHTML = prevData.type === 'cover' ? '' : prevData.right;
            const backHTML = currentData.type === 'cover' ? currentData.html : currentData.left;

            flipper.innerHTML = `
                <div class="front">${frontHTML}</div>
                <div class="back">${backHTML}</div>
            `;
            bookContainer.appendChild(flipper);

            setTimeout(() => {
                flipper.style.transform = 'rotateY(0deg)';
            }, 20);

            setTimeout(() => {
                currentIndex--;
                renderSpread();
                flipper.remove();
                isAnimating = false;
            }, 600);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') turnNext();
            if (e.key === 'ArrowLeft') turnPrev();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderSpread();
        });
    </script>
</body>
</html>
