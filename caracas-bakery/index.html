<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Assets | Caracas Bakery</title>
   <style>
    :root {
        --bg-color: #FFFFFF;
        --accent: #f4f4f4;
        /* Colores de la paleta colores.jpg */
        --cb-tan: #B9936C;
        --cb-cream: #EBE1D5;
        --cb-charcoal: #434244;
        --cb-taupe: #8C7E74;
        --cb-stone: #BDB5AD;
    }

    /* Definición de la animación de entrada */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    body {
        background-color: var(--bg-color);
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
    }

    header {
        width: 100%;
        padding: 80px 0 60px 0;
        text-align: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        background-color: rgba(255, 255, 255, 0);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Estado del Header al hacer scroll */
    header.scrolled {
        padding: 15px 0;
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        border-bottom: 1px solid var(--cb-stone);
    }

    .logo-bakery {
        max-height: 120px; 
        width: auto;
        display: inline-block;
        /* Animación inicial */
        animation: fadeInUp 1.2s ease-out forwards;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    header.scrolled .logo-bakery {
        max-height: 55px; /* Logo más pequeño al bajar */
    }

    .logo-bakery:hover {
        transform: scale(1.03);
        cursor: pointer;
    }

    .grid-container {
        max-width: 1100px;
        margin: 0 auto;
        /* Espacio para compensar el header fijo */
        padding: 260px 20px 80px 20px; 
        transition: padding 0.4s ease;
    }

    .bento-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 220px; 
        gap: 20px;
    }

    .bento-item {
        background-color: var(--accent);
        border-radius: 28px;
        padding: 30px;
        text-decoration: none;
        color: #000;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        text-align: right;
        box-sizing: border-box;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
    }

    .bento-item:hover {
        transform: scale(1.025);
        filter: brightness(0.97);
    }

    /* Colores aplicados de colores.jpg */
    .color-1 { background-color: rgba(185, 147, 108, 0.25) !important; color: #6d4c2b; }
    .color-2 { background-color: var(--cb-cream) !important; }
    .color-3 { background-color: var(--cb-charcoal) !important; color: #FFFFFF !important; }
    .color-3 p { color: #FFFFFF; opacity: 0.8 !important; }
    .color-4 { background-color: var(--cb-taupe) !important; color: #FFFFFF !important; }
    .color-4 p { color: #FFFFFF; opacity: 0.8 !important; }
    .color-5 { background-color: var(--cb-stone) !important; }
    .color-6 { background-color: var(--cb-tan) !important; color: #FFFFFF !important; }
    .color-6 p { color: #FFFFFF; opacity: 0.8 !important; }

    .bento-item h3 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    .bento-item p {
        margin: 5px 0 0 0;
        font-size: 0.85rem;
        opacity: 0.6;
    }

    .item-large { grid-column: span 2; grid-row: span 2; }
    .item-wide { grid-column: span 2; }

    @media (max-width: 768px) {
        .grid-container { padding-top: 180px; }
        .logo-bakery { max-height: 85px; }
        header.scrolled .logo-bakery { max-height: 45px; }
        .bento-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
        .item-large, .item-wide { grid-column: span 1; grid-row: span 1; }
        .bento-item { min-height: 180px; }
    }
</style>

</head>
<body>

<header>
    <img src="recursos/logo-caracas-bakery.png" class="logo-bakery" alt="Caracas Bakery Logo">
</header>

<div class="grid-container">
    <main class="bento-grid">
        
        <!-- 1. BRANDBOOK -->
        <a href="brandbook.html" class="bento-item item-large color-1">
            <h3>BRANDBOOK</h3>
            <p>Manual de identidad completo</p>
        </a>

        <!-- 2. LOGOTIPOS -->
        <a href="logos.html" class="bento-item color-2">
            <h3>LOGOTIPOS</h3>
            <p>Variantes (PNG, SVG, JPG)</p>
        </a>

        <!-- 3. MENÚ -->
        <a href="menu.html" class="bento-item color-3">
            <h3>MENÚ</h3>
            <p>Menú digital, CB y pizzas</p>
        </a>

        <!-- 4. FLYERS -->
        <a href="flyers.html" class="bento-item color-4">
            <h3>FLYERS</h3>
            <p>Promociones y eventos</p>
        </a>

        <!-- 5. MERCH -->
        <a href="merch.html"  class="bento-item color-5">
            <h3>MERCH</h3>
            <p>Franelas y delantales</p>
        </a>

        <!-- 6. STICKERS -->
        <a href="stickers.html" class="bento-item color-6">
            <h3>STICKERS</h3>
            <p>Diseños para empaque</p>
        </a>

        <!-- 7. PATRONES -->
        <a href="patrones.html" class="bento-item item-wide color-2">
            <h3>PATRONES</h3>
            <p>Texturas de marca e identidad visual</p>
        </a>

        <!-- 8. ROTULACIONES -->
        <a href="rotulaciones.html"  class="bento-item color-5">
            <h3>ROTULACIONES</h3>
            <p>Piezas gráficas para decoración</p>
        </a>
    </main>
</div>

<script>
    // Control del Sticky Header y reducción de Logo
    window.addEventListener('scroll', function() {
        const header = document.querySelector('header');
        if (window.scrollY > 40) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
</script>

</body>
</html>
