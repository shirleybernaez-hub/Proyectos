<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Catálogo de productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b1320;
            color: #111;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #0b1320;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }

        header img {
            width: 120px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 20px;
            border-radius: 30px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 0 5px;
        }
        .nav-btn:hover { opacity: 0.7; }

        .switch-btn {
            padding: 6px 16px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            background: rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .switch-btn.active, .switch-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .main-container {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estructura de libro abierto de lado a lado */
        .magazine-spread {
            width: 960px;
            height: 600px;
            background: #111;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border-radius: 8px;
            display: flex;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }

        .magazine-spread::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: rgba(0,0,0,0.2);
            z-index: 10;
        }

        .page {
            width: 50%;
            height: 100%;
            background-color: #f9f6f0;
            background-image: linear-gradient(to right, #e8dfd2 0%, #f9f6f0 5%, #f9f6f0 95%, #e8dfd2 100%);
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        .page-single {
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .page-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .prod-image-container {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .prod-image {
            max-height: 220px;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .cat-tag {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #9E2300;
            margin-bottom: 6px;
        }

        .prod-title {
            font-family: 'Playfair Display', serif;
            font-size: 19px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .prod-desc {
            font-size: 11px;
            color: #555;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        .page-num {
            font-size: 10px;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.1em;
            text-align: center;
            width: 100%;
        }

        .page-num-dark {
            color: #555 !important;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <img src="logo/logo_kantal blanco.png" alt="Kantal Logo">
        </div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="prevSpread()">&#10094;</button>
            <span id="pageIndicator">Página 1 / 7</span>
            <button class="nav-btn" onclick="nextSpread()">&#10095;</button>
        </div>

        <nav style="display: flex; gap: 10px;">
            <a href="index.html" class="switch-btn">Fichas Técnicas</a>
            <a href="catalogo.html" class="switch-btn active">Catálogo Revista</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="magazine-spread" id="spreadContainer">
            <!-- Renderizado dinámico -->
        </div>
    </div>

    <script>
        // Secuencia exacta solicitada:
        // Spread 0: Portada cerrada (Página 1)
        // Spread 1: Portada interna negra (Pj 2) + 1er producto (Pj 3)
        // Spread 2: Productos 2 y 3 (Pj 4 y 5)
        // Spread 3: Productos 4 y 5 (Pj 6 y 7)
        const spreads = [
            {
                type: 'single',
                pages: '1 / 7',
                html: `
                    <div class="page-single">
                        <div class="page-inner">
                            <img src="logo/logo_kantal blanco.png" style="width: 180px; margin-bottom: 25px;" alt="Logo">
                            <h1 style="font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; line-height: 1.3;">Catálogo de productos</h1>
                        </div>
                        <div class="page-num page-num-dark">1</div>
                    </div>
                `
            },
            {
                type: 'spread',
                pages: '2-3 / 7',
                left: `
                    <div class="page-inner">
                        <h2 style="font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; color: #aaa; letter-spacing: 0.1em;">KANTAL</h2>
                        <p style="font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #666; margin-top: 10px;">Tradicionalmente Sano</p>
                    </div>
                    <div class="page-num">2</div>
                `,
                right: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta de Carne</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/Supergalleta_carne.png" class="prod-image" alt="Súper Galleta de Carne">
                    </div>
                    <p class="prod-desc">Galletas horneadas con auténtico sabor a carne, ideales como premio nutritivo y energético para consentir a su mascota.</p>
                    <div class="page-num">3</div>
                `,
                isLeftDark: true
            },
            {
                type: 'spread',
                pages: '4-5 / 7',
                left: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta Cachorros</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalleta_cachorros.png" class="prod-image" alt="Súper Galleta Cachorros">
                    </div>
                    <p class="prod-desc">Fórmula especial de fácil digestión diseñada para el crecimiento saludable y la nutrición delicada de los cachorros.</p>
                    <div class="page-num">4</div>
                `,
                right: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta de Queso</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalleta_queso.png" class="prod-image" alt="Súper Galleta de Queso">
                    </div>
                    <p class="prod-desc">Irresistible sabor a queso seleccionado, aportando calcio y un estímulo de sabor único que encantará a su perro.</p>
                    <div class="page-num">5</div>
                `
            },
            {
                type: 'spread',
                pages: '6-7 / 7',
                left: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galleta de Pollo</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalletapollo.png" class="prod-image" alt="Súper Galleta de Pollo">
                    </div>
                    <p class="prod-desc">Bocados crujientes con exquisito sabor a pollo, ricos en proteínas de alta calidad para vitalidad diaria.</p>
                    <div class="page-num">6</div>
                `,
                right: `
                    <span class="cat-tag">Línea Súper Galletas</span>
                    <h3 class="prod-title">Súper Galletas de Salmón</h3>
                    <div class="prod-image-container">
                        <img src="fichas/catalogo/supergalletas_salmon.png" class="prod-image" alt="Súper Galletas de Salmón">
                    </div>
                    <p class="prod-desc">Enriquecidas con ácidos grasos esenciales Omega 3 para un pelaje brillante y una salud cutánea superior.</p>
                    <div class="page-num">7</div>
                `
            }
        ];

        let currentIndex = 0;

        function playPageSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = ctx.sampleRate * 0.12;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.04));
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 1.2;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.35, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                noise.start();
            } catch (e) {}
        }

        function renderSpread() {
            const container = document.getElementById('spreadContainer');
            const data = spreads[currentIndex];
            
            document.getElementById('pageIndicator').innerText = `Páginas ${data.pages}`;

            if (data.type === 'single') {
                container.innerHTML = data.html;
            } else {
                const leftBg = data.isLeftDark ? 'background: #111; color: #fff;' : '';
                container.innerHTML = `
                    <div class="page" style="${leftBg}">${data.left}</div>
                    <div class="page">${data.right}</div>
                `;
            }
        }

        function nextSpread() {
            if (currentIndex < spreads.length - 1) {
                currentIndex++;
                renderSpread();
                playPageSound();
            }
        }

        function prevSpread() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSpread();
                playPageSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSpread();
            if (e.key === 'ArrowLeft') prevSpread();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderSpread();
        });
    </script>
</body>
</html>
