<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Revista Digital • Page Curl 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #101c2d;
            --paper-cream: #f9f6f0;
            --paper-border: #e7e2d8;
            --accent-magenta: #e91e63;
        }

        body {
            background-color: var(--bg-deep);
            color: #111;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Fondo de líneas neón sutiles */
        .neon-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background: radial-gradient(circle at center, #182c4d 0%, #101c2d 100%);
        }
        .neon-line {
            position: absolute;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(233, 30, 99, 0.4), transparent);
            transform: rotate(-35deg);
            animation: moveNeon 12s linear infinite;
            filter: drop-shadow(0 0 8px rgba(233, 30, 99, 0.6));
        }
        .neon-line:nth-child(2) {
            top: 40%;
            animation-duration: 18s;
            animation-delay: -5s;
            background: linear-gradient(90deg, transparent, rgba(233, 30, 99, 0.25), transparent);
        }
        @keyframes moveNeon {
            0% { transform: translateY(-150px) rotate(-35deg); }
            100% { transform: translateY(800px) rotate(-35deg); }
        }

        /* Top Toolbar Estilo Visor */
        .top-toolbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }
        .top-logo img {
            width: 120px;
            filter: brightness(0) invert(1);
        }
        .magazine-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .ctrl-btn:hover { opacity: 0.6; }

        .section-switch {
            display: flex;
            gap: 10px;
        }
        .switch-link {
            padding: 6px 16px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            background: rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .switch-link.active, .switch-link:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Visor de Revista con Perspectiva 3D */
        .magazine-viewport {
            width: 72vw;
            height: 78vh;
            max-width: 1300px;
            max-height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 3000px;
        }

        .book {
            position: relative;
            width: 900px;
            height: 600px;
            display: flex;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            background: var(--paper-cream);
            border-radius: 4px;
            transform-style: preserve-3d;
        }

        /* Páginas base */
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            background-color: var(--paper-cream);
            background-image: linear-gradient(to right, #ece4da 0%, var(--paper-cream) 4%, var(--paper-cream) 96%, #ece4da 100%);
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            border-right: 1px solid var(--paper-border);
            backface-visibility: hidden;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 1.2s ease;
        }

        .page.right {
            right: 0;
            transform-origin: left center;
            z-index: 1;
        }

        .page.left {
            left: 0;
            transform-origin: right center;
            z-index: 1;
        }

        /* Efecto de despegue y giro de esquina 3D (Page Curl previo al giro total) */
        .page.curling {
            animation: cornerCurl 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        }

        @keyframes cornerCurl {
            0% {
                transform: rotateY(0deg) translateZ(0px);
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
            30% {
                /* La esquina y el lateral se levantan hacia el usuario con deformación de perspectiva */
                transform: rotateY(-25deg) translateZ(70px) rotateX(5deg);
                box-shadow: -20px 20px 40px rgba(0,0,0,0.3);
            }
            100% {
                transform: rotateY(-180deg) translateZ(20px);
                box-shadow: 20px 20px 40px rgba(0,0,0,0.4);
            }
        }

        /* Sombra dinámica de pliegue a lo largo del giro */
        .page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 100%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .page.curling::after {
            opacity: 1;
        }

        .serif-title {
            font-family: 'Playfair Display', serif;
        }
        
        /* Botón CTA Flotante */
        .cta-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0052cc;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 82, 204, 0.4);
            z-index: 100;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 82, 204, 0.6);
        }

        /* Barra Lateral de Herramientas */
        .side-toolbar {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 50;
        }
        .side-icon-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .side-icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Fondo Neón Dinámico -->
    <div class="neon-bg">
        <div class="neon-line" style="top: 20%;"></div>
        <div class="neon-line" style="top: 70%;"></div>
    </div>

    <!-- Barra Superior -->
    <header class="top-toolbar">
        <div class="top-logo">
            <img src="logo/logokantal.svg" alt="Kantal">
        </div>

        <div class="magazine-controls">
            <button class="ctrl-btn" onclick="prevPage()">&#10094;</button>
            <span id="pageIndicator">1 / 6</span>
            <button class="ctrl-btn" onclick="nextPage()">&#10095;</button>
        </div>

        <nav class="section-switch">
            <a href="index.html" class="switch-link">Fichas Técnicas</a>
            <a href="catalogo.html" class="switch-link active">Catálogo Revista</a>
        </nav>
    </header>

    <!-- Barra Lateral de Herramientas -->
    <div class="side-toolbar">
        <button class="side-icon-btn" title="Zoom">+</button>
        <button class="side-icon-btn" title="Alejar">-</button>
        <button class="side-icon-btn" title="Miniaturas">∷</button>
        <button class="side-icon-btn" title="Pantalla Completa">⛶</button>
    </div>

    <!-- Visor Principal -->
    <main class="magazine-viewport">
        <div class="book" id="bookContainer">
            <!-- Renderizado dinámico desde JS -->
        </div>
    </main>

    <!-- Botón CTA flotante -->
    <a href="#" class="cta-button">Edit it now →</a>

    <script>
        const magazinePages = [
            {
                type: "cover",
                category: "EDICIÓN DIGITAL",
                title: "KANTAL",
                subtitle: "FASHION & CARE LOOKBOOK",
                desc: "Tradicionalmente Sano. Una muestra exclusiva del cuidado y bienestar de alta gama para mascotas.",
                image: "logo/logokantal.svg"
            },
            {
                type: "editorial",
                category: "LÍNEA COSMÉTICA",
                title: "Colonia para Mascotas Macho",
                desc: "Fragancia exclusiva diseñada para resaltar un aroma duradero y varonil, manteniendo el cuidado delicado de su pelaje.",
                image: "COLONIA MACHIOS.jpg"
            },
            {
                type: "editorial",
                category: "LÍNEA COSMÉTICA",
                title: "Colonia para Perros y Gatos",
                desc: "Spray sin gas de uso diario que neutraliza olores y proporciona una frescura natural y agradable sin irritar su piel.",
                image: "COLONIA PERROS Y GATOS.jpg"
            },
            {
                type: "editorial",
                category: "LÍNEA COSMÉTICA",
                title: "Colonia para Mascotas Cachorros",
                desc: "Fórmula sumamente suave adaptada especialmente para la piel sensible de los cachorros, otorgando un aroma tierno y fresco.",
                image: "COLONIA CACHORROS.jpg"
            },
            {
                type: "editorial",
                category: "LÍNEA COSMÉTICA",
                title: "Champú Cosmético Perros y Gatos",
                desc: "Deja el pelo de su mascota con suave aroma y un brillo natural radiante, limpiando profundamente sin resecar.",
                image: "CHAMPU COSMETICO 240.jpg"
            },
            {
                type: "editorial",
                category: "LÍNEA COSMÉTICA",
                title: "Enjuague Desenredante",
                desc: "Suavizante de alto rendimiento que facilita el peinado, elimina nudos y aporta un brillo sedoso espectacular.",
                image: "ENJUAGUE DESENREDANTE 240.jpg"
            }
        ];

        let currentPageIndex = 0;
        let isAnimating = false;

        function renderMagazine() {
            const container = document.getElementById('bookContainer');
            container.innerHTML = '';

            magazinePages.forEach((page, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = `page ${index % 2 === 0 ? 'right' : 'left'}`;
                pageDiv.style.zIndex = magazinePages.length - index;

                if (page.type === 'cover') {
                    pageDiv.style.backgroundColor = '#111';
                    pageDiv.style.backgroundImage = 'none';
                    pageDiv.style.color = '#fff';
                    pageDiv.innerHTML = `
                        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; text-align:center;">
                            <span style="font-size:9px; letter-spacing:0.4em; color:#e91e63; margin-bottom:15px; font-weight:600;">${page.category}</span>
                            <h1 class="serif-title" style="font-size:38px; font-weight:700; letter-spacing:0.05em; margin-bottom:5px;">${page.title}</h1>
                            <p style="font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:#aaa; margin-bottom:30px;">${page.subtitle}</p>
                            <p style="font-size:11px; color:#888; max-width:280px; line-height:1.6;">${page.desc}</p>
                        </div>
                        <div style="font-size:10px; color:#555; text-align:center;">1</div>
                    `;
                } else {
                    pageDiv.innerHTML = `
                        <div>
                            <span style="font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.3em; color:#9E2300; display:block; margin-bottom:8px;">${page.category}</span>
                            <h2 class="serif-title" style="font-size:20px; font-weight:700; text-transform:uppercase; letter-spacing:-0.01em; margin-bottom:20px; line-height:1.1;">${page.title}</h2>
                            <div style="text-align:center; margin-bottom:20px;">
                                <img src="${page.image}" alt="${page.title}" style="max-height:240px; max-width:100%; object-fit:contain; filter:drop-shadow(0 10px 15px rgba(0,0,0,0.08));">
                            </div>
                        </div>
                        <div>
                            <p style="font-size:11px; color:#555; line-height:1.6; margin-bottom:15px;">${page.desc}</p>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #e7e2d8; padding-top:10px;">
                                <span style="font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.2em; color:#888;">Kantal Digital</span>
                                <span style="font-size:10px; font-weight:600; color:#888;">${index + 1}</span>
                            </div>
                        </div>
                    `;
                }

                container.appendChild(pageDiv);
            });

            updatePagesState();
        }

        function updatePagesState() {
            const pages = document.querySelectorAll('.page');
            pages.forEach((page, index) => {
                page.classList.remove('curling');
                if (index < currentPageIndex) {
                    page.style.transform = 'rotateY(-180deg) translateZ(0px)';
                    page.style.zIndex = index;
                } else {
                    page.style.transform = 'rotateY(0deg) translateZ(0px)';
                    page.style.zIndex = magazinePages.length - index;
                }
            });
            document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${magazinePages.length}`;
        }

        function nextPage() {
            if (isAnimating || currentPageIndex >= magazinePages.length - 1) return;
            isAnimating = true;

            const pages = document.querySelectorAll('.page');
            const activePage = pages[currentPageIndex];
            
            // Activar la animación de rizo en la esquina / página actual antes de voltear por completo
            activePage.classList.add('curling');

            setTimeout(() => {
                currentPageIndex++;
                updatePagesState();
                isAnimating = false;
            }, 1000); // Sincronizado con la duración del efecto de rizo 3D
        }

        function prevPage() {
            if (isAnimating || currentPageIndex <= 0) return;
            isAnimating = true;

            currentPageIndex--;
            const pages = document.querySelectorAll('.page');
            const targetPage = pages[currentPageIndex];
            
            targetPage.style.zIndex = magazinePages.length + 5;
            targetPage.classList.add('curling');
            // Revertir transform
            targetPage.style.transform = 'rotateY(0deg) translateZ(0px)';

            setTimeout(() => {
                updatePagesState();
                isAnimating = false;
            }, 1000);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        window.onload = renderMagazine;
    </script>
</body>
</html>
