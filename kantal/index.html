<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Fichas Técnicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; }
        
        .reveal { animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes reveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .grid-fichas {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 50px 40px;
        }
        @media (min-width: 768px) {
            .grid-fichas { grid-template-columns: repeat(3, 1fr); }
        }
        
        /* Estética de Chat Estilo Gemini */
        .chat-input-container {
            background-color: #f0f2f5;
            border-radius: 28px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .chat-input-container:focus-within {
            background-color: #fff;
            box-shadow: 0 0 0 1px #e5e7eb, 0 4px 12px rgba(0,0,0,0.05);
        }
        .chat-field {
            background: transparent;
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 13px;
            padding: 8px 0;
        }
        .icon-btn {
            color: #5f6368;
            transition: color 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .icon-btn:hover { color: #000; }
        
        .btn-download {
            transition: all 0.3s ease;
            border: 1.5px solid black;
        }
        .btn-download:hover { background: black; color: white; }

        /* Feedback de envío */
        .sent-success { color: #10b981 !important; transform: scale(1.1); }
    </style>
</head>
<body class="antialiased">

    <!-- HERO -->
    <section class="h-[30vh] md:h-[35vh] flex flex-col justify-center items-center text-center px-6">
        <div class="reveal">
            <img src="logo/logokantal.svg" alt="Kantal" class="w-64 md:w-[600px] h-auto">
        </div>
    </section>

    <!-- CUERPO -->
    <main class="max-w-7xl mx-auto py-4 px-6">
        
        <header class="mb-12 md:mb-16 text-center flex flex-col items-center">
            <h2 class="text-4xl md:text-6xl font-black tracking-tighter uppercase mb-2">FICHAS TÉCNICAS</h2>
            <p class="text-zinc-400 text-[10px] md:text-[12px] uppercase tracking-[0.4em] mb-12">Documentación Oficial de Productos</p>
            
            <div class="w-full text-left">
                <h3 class="text-xl md:text-2xl font-black uppercase tracking-tight mb-1">Línea de Perros y Gatos</h3>
                <div class="h-1 w-24 bg-black"></div>
            </div>
        </header>

        <section class="grid-fichas">
            
            <!-- Ficha 01: Enjuague Desenredante -->
            <article class="flex flex-col items-start">
                <h4 class="text-[11px] font-bold uppercase tracking-[0.1em] mb-4">Enjuague Desenredante</h4>
                
                <div class="w-full bg-[#fcfcfc] p-4 mb-4 border border-zinc-100 shadow-sm rounded-xl">
                    <img src="fichas/perrosygatos/Enjuage desenredante.jpg" 
                         alt="Ficha Técnica" 
                         class="w-full h-auto object-contain">
                </div>

                <div class="w-full flex flex-col gap-6">
                    <a href="fichas/perrosygatos/Enjuage desenredante.pdf" download 
                       class="btn-download px-6 py-3 text-[9px] font-black uppercase tracking-[0.2em] w-full text-center rounded-full">
                        Descargar PDF
                    </a>

                    <!-- Formulario con AJAX (Sin Salir de la Página) -->
                    <form id="form-desenredante" class="chat-form">
                        <input type="hidden" name="_subject" value="Comentario: Enjuague Desenredante">
                        
                        <div class="chat-input-container">
                            <label class="icon-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                                <input type="file" name="upload" class="hidden">
                            </label>

                            <input type="text" name="message" required placeholder="Escribe tus comentarios" class="chat-field">

                            <button type="submit" class="icon-btn submit-trigger">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </form>
                </div>
            </article>

        </section>
    </main>

    <script>
        // Lógica para enviar sin recargar la página (AJAX)
        const forms = document.querySelectorAll('.chat-form');
        
        forms.forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = form.querySelector('.submit-trigger');
                const input = form.querySelector('.chat-field');
                const formData = new FormData(form);

                try {
                    const response = await fetch('https://formspree.io/f/xvzlravo', {
                        method: 'POST',
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        input.value = '';
                        input.placeholder = '¡Enviado con éxito!';
                        btn.classList.add('sent-success');
                        setTimeout(() => {
                            input.placeholder = 'Escribe tus comentarios';
                            btn.classList.remove('sent-success');
                        }, 3000);
                    }
                } catch (error) {
                    input.placeholder = 'Error al enviar';
                }
            });
        });
    </script>

    <footer class="py-16 text-center border-t border-zinc-50 mt-20">
        <p class="text-zinc-300 text-[9px] font-bold uppercase tracking-[0.4em]">Kantal Food 2026</p>
    </footer>

</body>
</html>
