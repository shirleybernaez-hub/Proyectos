<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Catálogo Revista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #101c2d;
            color: #111;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Barra Superior */
        .top-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(16, 28, 45, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            box-sizing: border-box;
        }
        .top-logo img { width: 120px; filter: brightness(0) invert(1); }
        .magazine-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 30px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }
        .ctrl-btn:hover { opacity: 0.7; }
        .switch-link {
            padding: 6px 16px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            background: rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .switch-link.active, .switch-link:hover { background: #fff; color: #000; border-color: #fff; }

        /* Contenedor Fijo del Libro (Obliga el formato horizontal de doble página) */
        .book-container {
            width: 900px;
            height: 560px;
            background: #f9f6f0;
            display: flex;
            flex-direction: row;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-top: 40px;
        }

        .book-page {
            width: 50%;
            height: 100%;
            background-color: #f9f6f0;
            background-image: linear-gradient(to right, #ece4da 0%, #f9f6f0 5%, #f9f6f0 95%, #ece4da 100%);
            box-sizing: border-box;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .book-page.left {
            border-right: 1px solid #e7e2d8;
        }

        .book-page.right {
            border-left: 1px solid #fff;
        }

        .page-cover {
            background: #111 !important;
            background-image: none !important;
            color: #fff;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .page-img { max-height: 240px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); margin-bottom: 15px; }
        .page-category { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3em; color: #9E2300; margin-bottom: 6px; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; line-height: 1.1; }
        .page-desc { font-size: 11px; color: #555; line-height: 1.5; max-width: 280px; margin: 0 auto; }
        .page-footer { font-size: 9px; font-weight: 700; color: #999; letter-spacing: 0.1em; text-align: center; width: 100%; }

        .cta-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0052cc;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 82, 204, 0.4);
            z-index: 100;
        }
    </style>
</head>
<body>

    <header class="top-toolbar">
        <div class="top-logo">
            <img src="logo/logokantal.svg" alt="Kantal">
        </div>

        <div class="magazine-controls">
            <button class="ctrl-btn" onclick="prevSpread()">&#10094;</button>
            <span id="pageIndicator">Páginas 1-2 de 6</span>
            <button class="ctrl-btn" onclick="nextSpread()">&#10095;</button>
        </div>

        <nav style="display: flex; gap: 10px;">
            <a href="index.html" class="switch-link">Fichas Técnicas</a>
            <a href="catalogo.html" class="switch-link active">Catálogo Revista</a>
        </nav>
    </header>

    <!-- Contenedor estricto de doble página -->
    <div class="book-container" id="bookSpread"></div>

    <a href="#" class="cta-button">Edit it now →</a>

    <script>
        const catalogPages = [
            {
                type: "cover",
                category: "EDICIÓN DIGITAL",
                title: "CATÁLOGO OFICIAL",
                subtitle: "FASHION & CARE LOOKBOOK",
                desc: "Tradicionalmente Sano. Explora nuestra línea exclusiva para mascotas.",
                img: "logo/logokantal.svg"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Enjuague Desenredante",
                desc: "Suavizante de alto rendimiento que facilita el peinado, elimina nudos y aporta un brillo sedoso espectacular.",
                img: "fichas/catalogo/ENJUAGUE DESENR...240.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Champú Cosmético",
                desc: "Deja el pelo de su mascota con suave aroma y un brillo natural radiante, limpiando profundamente sin resecar.",
                img: "fichas/catalogo/CHAMPU COSME...240.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Colonia Cachorros",
                desc: "Fórmula sumamente suave adaptada especialmente para la piel sensible de los cachorros, otorgando un aroma tierno y fresco.",
                img: "fichas/catalogo/COLONIA CACHORROS.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Colonia Mascotas Macho",
                desc: "Fragancia exclusiva diseñada para resaltar un aroma duradero y varonil, manteniendo el cuidado delicado de su pelaje.",
                img: "fichas/catalogo/COLONIA MACHIOS.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Colonia Perros y Gatos",
                desc: "Spray sin gas de uso diario que neutraliza olores y proporciona una frescura natural y agradable sin irritar su piel.",
                img: "fichas/catalogo/COLONIA PERROS...OS.png"
            }
        ];

        let currentSpread = 0;
        const totalSpreads = Math.ceil(catalogPages.length / 2);

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.03));
                }
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                src.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                src.start();
            } catch (e) {}
        }

        function render() {
            const container = document.getElementById('bookSpread');
            const leftIdx = currentSpread * 2;
            const rightIdx = leftIdx + 1;

            const left = catalogPages[leftIdx];
            const right = catalogPages[rightIdx];

            let leftHtml = '';
            let rightHtml = '';

            if (left) {
                if (left.type === 'cover') {
                    leftHtml = `
                        <div class="book-page left page-cover">
                            <div class="page-content">
                                <img src="${left.img}" style="width: 150px; filter: brightness(0) invert(1); margin-bottom: 15px;" alt="Logo">
                                <h1 style="font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin-bottom: 8px;">${left.title}</h1>
                                <p style="font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: #aaa; margin-bottom: 15px;">${left.subtitle}</p>
                                <p style="font-size: 10px; color: #888; max-width: 240px; line-height: 1.4;">${left.desc}</p>
                            </div>
                            <div class="page-footer" style="color: #666;">1</div>
                        </div>
                    `;
                } else {
                    leftHtml = `
                        <div class="book-page left">
                            <div class="page-content">
                                <span class="page-category">${left.category}</span>
                                <h3 class="page-title">${left.title}</h3>
                                <img src="${left.img}" class="page-img" alt="${left.title}">
                                <p class="page-desc">${left.desc}</p>
                            </div>
                            <div class="page-footer">${leftIdx + 1}</div>
                        </div>
                    `;
                }
            } else {
                leftHtml = `<div class="book-page left"></div>`;
            }

            if (right) {
                rightHtml = `
                    <div class="book-page right">
                        <div class="page-content">
                            <span class="page-category">${right.category}</span>
                            <h3 class="page-title">${right.title}</h3>
                            <img src="${right.img}" class="page-img" alt="${right.title}">
                            <p class="page-desc">${right.desc}</p>
                        </div>
                        <div class="page-footer">${rightIdx + 1}</div>
                    </div>
                `;
            } else {
                rightHtml = `<div class="book-page right"></div>`;
            }

            container.innerHTML = leftHtml + rightHtml;
            document.getElementById('pageIndicator').innerText = `Páginas ${leftIdx + 1}-${Math.min(rightIdx + 1, catalogPages.length)} de ${catalogPages.length}`;
        }

        function nextSpread() {
            if (currentSpread < totalSpreads - 1) {
                currentSpread++;
                render();
                playSound();
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                currentSpread--;
                render();
                playSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSpread();
            if (e.key === 'ArrowLeft') prevSpread();
        });

        window.onload = render;
    </script>
</body>
</html>
