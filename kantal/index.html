<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Fichas Técnicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; margin: 0; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0px); }
        }

        /* HEADER CORREGIDO: z-index superior para evitar que el texto se superponga */
        header#main-header {
            width: 100%;
            padding: 50px 0 20px 0; 
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999; 
            background-color: transparent;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        header#main-header.scrolled {
            padding: 12px 0;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #eee;
        }

        .logo-kantal {
            width: 320px; 
            md:width: 550px;
            max-width: 85%;
            height: auto;
            display: inline-block;
            animation: fadeInUp 1.2s ease-out forwards;
            transition: width 0.5s ease;
        }

        header.scrolled .logo-kantal {
            width: 160px; /* Tamaño equilibrado en sticky */
        }

        /* CONTENEDOR: El padding evita que el contenido choque con el header fijo */
        .content-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 260px 20px 80px 20px; 
        }

        @media (max-width: 768px) {
            .content-wrapper { padding-top: 200px; }
            .logo-kantal { width: 260px; } 
            header.scrolled .logo-kantal { width: 130px; }
        }

        /* FORMULARIO ESTILO GEMINI */
        .chat-input-container {
            background-color: #f3f4f6;
            border-radius: 24px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .chat-input-container:focus-within {
            background-color: #fff;
            box-shadow: 0 0 0 1px #ddd, 0 4px 12px rgba(0,0,0,0.05);
        }
        .chat-field { background: transparent; border: none; outline: none; flex-grow: 1; font-size: 14px; }
        
        .btn-download { transition: all 0.3s ease; border: 2px solid black; }
        .btn-download:hover { background: black; color: white; }
    </style>
</head>
<body>

    <header id="main-header">
        <img src="logo/logokantal.svg" class="logo-kantal" alt="Kantal Logo">
    </header>

    <div class="content-wrapper">
        <!-- TITULOS: Ahora quedan debajo del Header por el z-index -->
        <div class="text-center mb-16">
            <!-- Reducción drástica del tamaño para que no compita con el logo -->
            <h2 class="text-3xl md:text-4xl font-black tracking-tighter uppercase mb-2">Fichas Técnicas</h2>
            <p class="text-zinc-400 text-[9px] md:text-[11px] uppercase tracking-[0.4em] mb-12">Documentación Oficial de Productos</p>
            
            <div class="text-left max-w-4xl mx-auto">
                <h3 class="text-lg md:text-xl font-black uppercase tracking-tight mb-1">Línea de Perros y Gatos</h3>
                <div class="h-1 w-20 bg-black"></div>
            </div>
        </div>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- Ficha 01 -->
            <article class="flex flex-col group">
                <h4 class="text-[11px] font-bold uppercase tracking-[0.1em] mb-4">Enjuague Desenredante</h4>
                <div class="w-full bg-[#fcfcfc] p-4 mb-4 border border-zinc-100 shadow-sm rounded-2xl overflow-hidden">
                    <img src="fichas/perrosygatos/Enjuage desenredante.jpg" class="w-full h-auto object-contain transition-transform group-hover:scale-105">
                </div>
                <div class="flex flex-col gap-4">
                    <a href="fichas/perrosygatos/Enjuage desenredante.pdf" download class="btn-download px-6 py-3 text-[10px] font-black uppercase tracking-[0.2em] w-full text-center rounded-full">Descargar PDF</a>
                    <form class="chat-form">
                        <div class="chat-input-container">
                            <label class="cursor-pointer text-zinc-400 hover:text-black">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                                <input type="file" name="upload" class="hidden">
                            </label>
                            <input type="text" name="message" placeholder="Escribe tus comentarios" class="chat-field">
                            <button type="submit" class="text-zinc-400 hover:text-black">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </form>
                </div>
            </article>
        </section>
    </div>

    <script>
        window.addEventListener('scroll', function() {
            const header = document.getElementById('main-header');
            if (window.scrollY > 40) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        document.querySelectorAll('.chat-form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = form.querySelector('.chat-field');
                input.placeholder = "Enviando...";
                try {
                    await fetch('https://formspree.io/f/xvzlravo', {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });
                    input.value = "";
                    input.placeholder = "¡Recibido!";
                    setTimeout(() => input.placeholder = "Escribe tus comentarios", 3000);
                } catch (err) { input.placeholder = "Error"; }
            });
        });
    </script>
</body>
</html>
