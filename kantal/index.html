<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTAL | Catálogo Revista Editorial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #101c2d;
            --paper-cream: #f9f6f0;
            --paper-border: #e7e2d8;
        }

        body {
            background-color: var(--bg-deep);
            color: #111;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Fondo de líneas neón sutiles */
        .neon-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background: radial-gradient(circle at center, #182c4d 0%, #101c2d 100%);
        }
        .neon-line {
            position: absolute;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(233, 30, 99, 0.4), transparent);
            transform: rotate(-35deg);
            animation: moveNeon 12s linear infinite;
            filter: drop-shadow(0 0 8px rgba(233, 30, 99, 0.6));
        }
        .neon-line:nth-child(2) {
            top: 40%;
            animation-duration: 18s;
            animation-delay: -5s;
            background: linear-gradient(90deg, transparent, rgba(233, 30, 99, 0.25), transparent);
        }
        @keyframes moveNeon {
            0% { transform: translateY(-150px) rotate(-35deg); }
            100% { transform: translateY(800px) rotate(-35deg); }
        }

        /* Barra Superior */
        .top-toolbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            background: rgba(16, 28, 45, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        .top-logo img {
            width: 120px;
            filter: brightness(0) invert(1);
        }
        .magazine-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .ctrl-btn:hover { opacity: 0.6; }

        .section-switch {
            display: flex;
            gap: 10px;
        }
        .switch-link {
            padding: 6px 16px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            background: rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .switch-link.active, .switch-link:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Contenedor Doble Página Abierta (Estilo Libro Real) */
        .magazine-viewport {
            margin-top: 40px;
            width: 900px;
            height: 560px;
            display: flex;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border-radius: 6px;
            position: relative;
            background: #fff;
        }

        .book-page {
            width: 50%;
            height: 100%;
            background-color: var(--paper-cream);
            box-sizing: border-box;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .book-page.left {
            border-right: 1px solid var(--paper-border);
            background-image: linear-gradient(to right, #e2dad0 0%, var(--paper-cream) 8%);
        }

        .book-page.right {
            border-left: 1px solid #fff;
            background-image: linear-gradient(to left, #e2dad0 0%, var(--paper-cream) 8%);
        }

        .page-cover {
            background: #111 !important;
            color: #fff;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .page-img { max-height: 240px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); margin-bottom: 15px; }
        .page-category { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3em; color: #9E2300; margin-bottom: 6px; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; line-height: 1.1; }
        .page-desc { font-size: 11px; color: #555; line-height: 1.5; max-width: 300px; margin: 0 auto; }
        .page-footer { font-size: 9px; font-weight: 700; color: #999; letter-spacing: 0.1em; text-align: center; width: 100%; }

        /* Botón CTA Flotante */
        .cta-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0052cc;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 82, 204, 0.4);
            z-index: 100;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 82, 204, 0.6);
        }
    </style>
</head>
<body>

    <div class="neon-bg">
        <div class="neon-line" style="top: 20%;"></div>
        <div class="neon-line" style="top: 70%;"></div>
    </div>

    <header class="top-toolbar">
        <div class="top-logo">
            <img src="logo/logokantal.svg" alt="Kantal">
        </div>

        <div class="magazine-controls">
            <button class="ctrl-btn" onclick="prevSpread()">&#10094;</button>
            <span id="pageIndicator">Páginas 1-2 / 6</span>
            <button class="ctrl-btn" onclick="nextSpread()">&#10095;</button>
        </div>

        <nav class="section-switch">
            <a href="index.html" class="switch-link">Fichas Técnicas</a>
            <a href="catalogo.html" class="switch-link active">Catálogo Revista</a>
        </nav>
    </header>

    <main class="magazine-viewport" id="bookSpread">
        <!-- Renderizado dinámico de doble página -->
    </main>

    <a href="#" class="cta-button">Edit it now →</a>

    <script>
        const pagesData = [
            {
                type: "cover",
                category: "EDICIÓN DIGITAL",
                title: "CATÁLOGO OFICIAL",
                subtitle: "FASHION & CARE LOOKBOOK",
                desc: "Tradicionalmente Sano. Explora la línea exclusiva de productos para tus mascotas.",
                img: "logo/logokantal.svg"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Enjuague Desenredante",
                desc: "Suavizante de alto rendimiento que facilita el peinado, elimina nudos y aporta un brillo sedoso espectacular.",
                img: "fichas/catalogo/ENJUAGUE DESENR...240.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Champú Cosmético",
                desc: "Deja el pelo de su mascota con suave aroma y un brillo natural radiante, limpiando profundamente sin resecar.",
                img: "fichas/catalogo/CHAMPU COSME...240.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Colonia Cachorros",
                desc: "Fórmula sumamente suave adaptada especialmente para la piel sensible de los cachorros, otorgando un aroma tierno y fresco.",
                img: "fichas/catalogo/COLONIA CACHORROS.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Colonia Mascotas Macho",
                desc: "Fragancia exclusiva diseñada para resaltar un aroma duradero y varonil, manteniendo el cuidado delicado de su pelaje.",
                img: "fichas/catalogo/COLONIA MACHIOS.png"
            },
            {
                type: "product",
                category: "Línea Cosmética",
                title: "Colonia Perros y Gatos",
                desc: "Spray sin gas de uso diario que neutraliza olores y proporciona una frescura natural y agradable sin irritar su piel.",
                img: "fichas/catalogo/COLONIA PERROS...OS.png"
            }
        ];

        let currentSpread = 0; // 0 = Portada/Página 2, 1 = Páginas 3-4, 2 = Páginas 5-6
        const maxSpreads = Math.ceil(pagesData.length / 2);

        function playPageSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.04));
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 3;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch (e) {}
        }

        function renderSpread() {
            const container = document.getElementById('bookSpread');
            const leftIdx = currentSpread * 2;
            const rightIdx = leftIdx + 1;

            const leftData = pagesData[leftIdx];
            const rightData = pagesData[rightIdx];

            let leftHtml = '';
            let rightHtml = '';

            // Renderizar página izquierda
            if (leftData) {
                if (leftData.type === 'cover') {
                    leftHtml = `
                        <div class="book-page left page-cover">
                            <div class="page-content">
                                <img src="${leftData.img}" style="width: 140px; filter: brightness(0) invert(1); margin-bottom: 12px;" alt="Logo">
                                <h1 style="font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; margin-bottom: 6px;">${leftData.title}</h1>
                                <p style="font-size: 9px; letter-spacing: 0.3s; text-transform: uppercase; color: #aaa; margin-bottom: 12px;">${leftData.subtitle}</p>
                                <p style="font-size: 10px; color: #888; max-width: 220px; line-height: 1.4;">${leftData.desc}</p>
                            </div>
                            <div class="page-footer" style="color: #666;">1</div>
                        </div>
                    `;
                } else {
                    leftHtml = `
                        <div class="book-page left">
                            <div class="page-content">
                                <span class="page-category">${leftData.category}</span>
                                <h3 class="page-title">${leftData.title}</h3>
                                <img src="${leftData.img}" class="page-img" alt="${leftData.title}">
                                <p class="page-desc">${leftData.desc}</p>
                            </div>
                            <div class="page-footer">${leftIdx + 1}</div>
                        </div>
                    `;
                }
            } else {
                leftHtml = `<div class="book-page left"></div>`;
            }

            // Renderizar página derecha
            if (rightData) {
                rightHtml = `
                    <div class="book-page right">
                        <div class="page-content">
                            <span class="page-category">${rightData.category}</span>
                            <h3 class="page-title">${rightData.title}</h3>
                            <img src="${rightData.img}" class="page-img" alt="${rightData.title}">
                            <p class="page-desc">${rightData.desc}</p>
                        </div>
                        <div class="page-footer">${rightIdx + 1}</div>
                    </div>
                `;
            } else {
                rightHtml = `<div class="book-page right"></div>`;
            }

            container.innerHTML = leftHtml + rightHtml;
            document.getElementById('pageIndicator').innerText = `Páginas ${leftIdx + 1}-${Math.min(rightIdx + 1, pagesData.length)} / ${pagesData.length}`;
        }

        function nextSpread() {
            if (currentSpread < maxSpreads - 1) {
                currentSpread++;
                renderSpread();
                playPageSound();
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                currentSpread--;
                renderSpread();
                playPageSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSpread();
            if (e.key === 'ArrowLeft') prevSpread();
        });

        window.onload = renderSpread;
    </script>
</body>
</html>
