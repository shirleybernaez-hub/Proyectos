<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandbook | Caracas Bakery</title>
    <style>
        :root {
            --cb-tan: #B9936C;
            --cb-charcoal: #434244;
            --cb-stone: #BDB5AD;
            --cb-cream: #EBE1D5;
            --bg-light: #FAFAFA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--cb-charcoal);
        }

        /* Breadcrumbs estilo Logotipos */
        .nav-back {
            padding: 40px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-back a {
            text-decoration: none;
            color: var(--cb-tan);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: opacity 0.3s ease;
        }

        .nav-back a:hover { opacity: 0.7; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
            text-align: center;
        }

        header {
            margin-bottom: 60px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--cb-stone);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Tarjeta Principal del Manual */
        .brandbook-card {
            background: white;
            border-radius: 32px;
            padding: 60px 40px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.03);
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .brandbook-card:hover {
            transform: translateY(-5px);
        }

        .preview-icon {
            width: 120px;
            height: 120px;
            background-color: var(--cb-cream);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .preview-icon svg {
            width: 50px;
            color: var(--cb-tan);
        }

        .info {
            margin-bottom: 40px;
        }

        .info h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info p {
            color: var(--cb-stone);
            font-size: 0.9rem;
        }

        /* Botón de descarga */
        .download-btn {
            display: inline-block;
            padding: 18px 45px;
            background-color: transparent;
            border: 2px solid var(--cb-tan);
            color: var(--cb-tan);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background-color: var(--cb-tan);
            color: white;
            box-shadow: 0 10px 20px rgba(185, 147, 108, 0.2);
        }

        @media (max-width: 768px) {
            .brandbook-card { padding: 40px 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-back">
        <a href="index.html">← Volver al Panel</a>
    </nav>

    <div class="container">
        <header>
            <h1>Manual de Identidad</h1>
            <p class="subtitle">Guía completa de uso de marca, tipografías y normativas visuales de Caracas Bakery.</p>
        </header>

        <main>
            <div class="brandbook-card">
                <div class="preview-icon">
                    <!-- Icono representativo de PDF/Documento -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                    </svg>
                </div>
                
                <div class="info">
                    <h2>Brandbook Oficial 2026</h2>
                    <p>Archivo PDF • Alta Resolución • 12.4 MB</p>
                </div>

                <a href="recursos/brandbook.pdf" download class="download-btn">Descargar Manual Completo</a>
            </div>
        </main>
    </div>

</body>
</html>
